<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Raccolta idee</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #faf8f3;
    --ink: #1b1a17;
    --teal: #1f5d63;
    --teal-hover: #16555b;
    --muted: #706b5e;
    --line: #d9d4c7;
    --field-line: #8f8a7c;
    --placeholder: #959082;
    --error: #9a4b3f;
    --sans: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    --serif: "Cormorant Garamond", Georgia, serif;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html, body { margin: 0; background: var(--cream); color: var(--ink); }
  body { font: 16px/1.5 var(--sans); min-height: 100vh; display: grid; place-items: center; padding: 48px 16px; }

  .blocco { text-align: center; }
  .blocco a { color: var(--teal); }

  main { width: 100%; max-width: 560px; }
  .overline { font-size: 11px; font-weight: 600; letter-spacing: 0.3em; text-transform: uppercase; color: var(--teal); }
  h1 { font: 300 clamp(2.6rem, 8vw, 3.6rem)/1.04 var(--serif); letter-spacing: 0.01em; margin: 0.6rem 0 0; }
  .rule { width: 48px; height: 1px; background: var(--teal); margin: 1.4rem 0; }
  .sfida { font: 400 clamp(1.4rem, 4.5vw, 1.7rem)/1.3 var(--serif); margin: 0 0 0.4rem; }
  .intro { color: var(--muted); margin: 0 0 2rem; }

  label { display: block; font-size: 11px; font-weight: 600; letter-spacing: 0.2em; text-transform: uppercase; color: var(--muted); margin-bottom: 0.5rem; }
  textarea {
    width: 100%; min-height: 11rem; resize: vertical; padding: 0.9rem 1rem;
    font: 400 1.3rem/1.4 var(--serif); color: var(--ink);
    background: #fff; border: 1px solid var(--field-line); border-radius: 2px;
  }
  textarea::placeholder { color: var(--placeholder); }
  textarea:focus { outline: 2px solid var(--teal); outline-offset: 1px; border-color: var(--teal); }

  .riga { display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-top: 0.6rem; }
  .conta { font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .conta.pieno { color: var(--error); }
  button.invia {
    min-height: 44px; padding: 0 1.6rem; border: 0; border-radius: 2px; cursor: pointer;
    font: 600 12px var(--sans); letter-spacing: 0.2em; text-transform: uppercase;
    background: var(--teal); color: var(--cream); transition: background 0.2s ease;
  }
  button.invia:hover { background: var(--teal-hover); }
  button.invia:focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  button.invia:disabled { opacity: 0.6; cursor: default; }

  .msg { min-height: 1.5em; margin: 1rem 0 0; font-size: 14px; }
  .msg.ok { color: var(--teal); }
  .msg.errore { color: var(--error); }

  .esci { margin-top: 3rem; text-align: center; }
  .esci button { font: 13px var(--sans); background: none; border: 0; padding: 8px; color: var(--muted); text-decoration: underline; cursor: pointer; }
</style>
</head>
<body>
<div class="blocco" id="blocco" hidden><p>Area riservata. <a href="/">Accedi dalla pagina iniziale</a>.</p></div>

<main id="pagina" hidden>
  <div class="overline">Area riservata</div>
  <h1>Raccolta idee</h1>
  <div class="rule"></div>
  <p class="sfida">Butta qui le tue idee se hai il coraggio.</p>
  <p class="intro">Le idee arriveranno dritte ad Aco che te le ruberà.</p>

  <form id="modulo" novalidate>
    <label for="testo">La tua idea</label>
    <textarea id="testo" maxlength="500" placeholder="Scrivi qui…" required></textarea>
    <div class="riga">
      <span class="conta" id="conta" aria-live="polite">0 / 500</span>
      <button class="invia" id="invia" type="submit">Invia</button>
    </div>
    <p class="msg" id="msg" role="status" aria-live="polite"></p>
  </form>

  <p class="esci"><button type="button" id="esci">Esci</button></p>
</main>

<script>
  /*
    Come /nonna: il login della home rimanda qui con il token nel frammento (#k=...).
    Il token va in sessionStorage e sparisce subito dall'indirizzo. dati.json è cifrato
    con quel token (PBKDF2 250.000 + AES-GCM) e contiene l'indirizzo dello script Google
    che scrive le idee nel foglio. Lo genera OneDrive/acoprogetti/raccolta idee/pubblica_sito.py.
    Non modificare dati.json a mano.
  */
  (async function () {
    var CHIAVE = "giorgio-k";
    var m = location.hash.match(/[#&]k=([^&]+)/);
    try { if (m) sessionStorage.setItem(CHIAVE, decodeURIComponent(m[1])); } catch (e) {}
    if (m) history.replaceState(null, "", location.pathname);
    window.addEventListener("hashchange", function () { location.reload(); });

    function bloccato() { document.getElementById("blocco").hidden = false; }

    var k = null;
    try { k = sessionStorage.getItem(CHIAVE); } catch (e) {}
    if (!k || !window.crypto || !crypto.subtle) return bloccato();
    try {
      var c = await fetch("dati.json", { cache: "no-store" }).then(function (r) { return r.json(); });
      var b = function (s) { return Uint8Array.from(atob(s), function (x) { return x.charCodeAt(0); }); };
      var km = await crypto.subtle.importKey("raw", new TextEncoder().encode(k), "PBKDF2", false, ["deriveKey"]);
      var key = await crypto.subtle.deriveKey({ name: "PBKDF2", salt: b(c.salt), iterations: c.iterations, hash: "SHA-256" },
        km, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
      var pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv: b(c.iv) }, key, b(c.ct));
      var d = JSON.parse(new TextDecoder().decode(pt));
    } catch (e) { return bloccato(); }

    var MAX = d.max || 500;
    var modulo = document.getElementById("modulo");
    var testo = document.getElementById("testo");
    var conta = document.getElementById("conta");
    var invia = document.getElementById("invia");
    var msg = document.getElementById("msg");

    testo.maxLength = MAX;
    function aggiornaConta() {
      conta.textContent = testo.value.length + " / " + MAX;
      conta.classList.toggle("pieno", testo.value.length >= MAX);
    }
    function scrivi(t, tipo) { msg.textContent = t; msg.className = "msg " + (tipo || ""); }

    testo.addEventListener("input", function () { aggiornaConta(); scrivi(""); });

    modulo.addEventListener("submit", async function (e) {
      e.preventDefault();
      var t = testo.value.trim();
      if (!t) { scrivi("Scrivi qualcosa prima di inviare.", "errore"); testo.focus(); return; }
      invia.disabled = true;
      scrivi("Invio…");
      try {
        // corpo in text/plain: niente preflight CORS verso Apps Script
        var r = await fetch(d.endpoint, { method: "POST", body: JSON.stringify({ testo: t }) });
        var j = await r.json();
        if (j.ok) {
          testo.value = "";
          aggiornaConta();
          scrivi("Grazie, idea inviata.", "ok");
        } else if (j.errore === "troppe") {
          scrivi("Troppi invii in poco tempo. Riprova più tardi.", "errore");
        } else {
          scrivi("Il testo non è valido: massimo " + MAX + " caratteri.", "errore");
        }
      } catch (err) {
        scrivi("Invio non riuscito. Controlla la connessione e riprova.", "errore");
      }
      invia.disabled = false;
    });

    document.getElementById("esci").addEventListener("click", function () {
      try { sessionStorage.removeItem(CHIAVE); } catch (e) {}
      location.href = "/";
    });

    document.getElementById("pagina").hidden = false;
    aggiornaConta();
  })();
</script>
</body>
</html>
