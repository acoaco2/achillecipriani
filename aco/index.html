<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="robots" content="noindex, nofollow" />
<title>Area personale · Achille Cipriani</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
<link rel="apple-touch-icon" href="/favicon-180.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --cream: #faf8f3;
    --ink: #1b1a17;
    --teal: #1f5d63;
    --teal-deep: #123f44;
    --mint: #8fd4c8;
    --cream-soft: #cfdedb;
    --muted: #706b5e;
    --line: #d9d4c7;
    --accent: #1f5d63;
    --accent-deep: #16555b;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: var(--cream); color: var(--ink);
    font-family: ui-sans-serif, -apple-system, "Helvetica Neue", Arial, sans-serif;
    -webkit-font-smoothing: antialiased; min-height: 100vh;
  }
  .split { min-height: 100vh; display: grid; grid-template-columns: 1.05fr 1fr; }

  /* ---- Pannello sinistro: verde petrolio drenched, come la home ---- */
  .panel {
    background: radial-gradient(125% 95% at 12% 0%, #235e64 0%, var(--teal-deep) 100%);
    color: var(--cream); display: grid; grid-template-rows: 1fr auto;
    padding: clamp(2.5rem, 5vw, 5.5rem);
  }
  .panel-main { align-self: center; }
  .logo { width: 76px; height: 76px; margin-bottom: 2rem; animation: rise 1s 0.02s ease both; }
  .logo svg { display: block; width: 100%; height: 100%; }
  .logo .st { fill: none; stroke: var(--cream); }
  .overline {
    font-size: 11px; letter-spacing: 0.42em; text-transform: uppercase;
    color: var(--cream-soft); margin-bottom: 1.4rem; padding-left: 0.42em;
    animation: rise 0.9s 0.14s ease both;
  }
  .name {
    font-family: "Cormorant Garamond", serif; font-weight: 300;
    font-size: clamp(2.8rem, 4.8vw, 4.4rem); line-height: 1.04; letter-spacing: 0.01em;
    color: var(--cream); animation: rise 1s 0.2s ease both;
  }
  .rule { width: 54px; height: 3px; background: var(--mint); border-radius: 2px; margin: 2rem 0 0; animation: rise 1s 0.34s ease both; }
  .panel-foot { align-self: end; padding-top: 2rem; animation: rise 1s 0.6s ease both; }
  .panel-foot button {
    background: none; border: none; cursor: pointer; padding: 0.4rem 0; min-height: 44px;
    color: var(--cream); font: inherit; font-size: 13px; letter-spacing: 0.04em;
    border-bottom: 1px solid rgba(143, 212, 200, 0.5);
  }
  .panel-foot button:hover { border-color: var(--mint); }
  .panel-foot button:focus-visible { outline: 1px solid var(--mint); outline-offset: 4px; }

  /* ---- Lato destro: sezioni su crema ---- */
  .side { display: flex; align-items: center; justify-content: center; padding: clamp(2rem, 5vw, 4rem); }
  .sections { width: 100%; max-width: 340px; display: flex; flex-direction: column; gap: 1.3rem; animation: rise 1s 0.3s ease both; }
  .label { font-size: 11px; letter-spacing: 0.3em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .list { list-style: none; border-top: 1px solid var(--line); }
  .list a {
    display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    padding: 1.1rem 0; border-bottom: 1px solid var(--line);
    color: var(--ink); text-decoration: none; min-height: 44px;
  }
  .list .t { font-family: "Cormorant Garamond", serif; font-size: 1.7rem; line-height: 1.1; }
  .list .d { display: block; font-size: 12.5px; color: var(--muted); margin-top: 0.3rem; letter-spacing: 0.02em; }
  .list .arrow { color: var(--accent); font-size: 1.1rem; transition: transform 0.25s ease; }
  .list a:hover .arrow { transform: translateX(4px); }
  .list a:hover .t { color: var(--accent); }
  .list a:focus-visible { outline: 1px solid var(--accent); outline-offset: 4px; }
  .locked { font-size: 14px; color: var(--muted); line-height: 1.6; }
  .locked a { color: var(--accent); }
  [hidden] { display: none !important; }

  @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  @media (max-width: 760px) {
    .split { grid-template-columns: 1fr; }
    .panel { grid-template-rows: auto; padding: clamp(2.4rem, 8vw, 3.5rem) 28px; }
    .panel-foot { display: none; }
    .side { padding: 2.6rem 28px 3.5rem; align-items: flex-start; }
    .name { font-size: clamp(2.6rem, 9vw, 3.4rem); }
  }
  @media (prefers-reduced-motion: reduce) {
    .logo, .overline, .name, .rule, .panel-foot, .sections { animation: none; opacity: 1; transform: none; }
  }
</style>
</head>
<body>
  <main class="split">
    <section class="panel">
      <div class="panel-main">
        <div class="logo">
          <svg viewBox="0 0 150 150" aria-hidden="true">
            <circle class="st" stroke-width="2.5" cx="75" cy="75" r="62"></circle>
            <path class="st" stroke-width="2.5" stroke-linecap="round" d="M101 39 A44 44 0 1 0 101 111"></path>
            <path class="st" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" d="M60 92 L75 56 L90 92"></path>
          </svg>
        </div>
        <div class="overline">Area personale</div>
        <h1 class="name">Ciao Aco</h1>
        <div class="rule"></div>
      </div>
      <div class="panel-foot" id="foot" hidden>
        <button type="button" id="esci">Esci</button>
      </div>
    </section>

    <section class="side">
      <div class="sections">
        <div class="label">Sezioni</div>
        <ul class="list" id="list" hidden>
          <li>
            <a href="audiolibri/">
              <span><span class="t">Audiolibri</span><span class="d">Libri ascoltati, statistiche e consigli</span></span>
              <span class="arrow" aria-hidden="true">→</span>
            </a>
          </li>
        </ul>
        <p class="locked" id="locked" hidden>Area riservata. <a href="/">Accedi dalla pagina iniziale</a>.</p>
      </div>
    </section>
  </main>

<script>
  /*
    Il login della home rimanda qui con il token nel frammento (#k=...).
    Il token va in sessionStorage e sparisce subito dall'indirizzo: le sezioni
    (per esempio audiolibri/) lo usano per decifrare i loro dati.
  */
  (function () {
    var CHIAVE = "aco-k";
    var m = location.hash.match(/[#&]k=([^&]+)/);
    try {
      if (m) sessionStorage.setItem(CHIAVE, decodeURIComponent(m[1]));
    } catch (e) {}
    if (m) history.replaceState(null, "", location.pathname);

    var token = null;
    try { token = sessionStorage.getItem(CHIAVE); } catch (e) {}
    document.getElementById(token ? "list" : "locked").hidden = false;
    document.getElementById("foot").hidden = !token;

    document.getElementById("esci").addEventListener("click", function () {
      try { sessionStorage.removeItem(CHIAVE); } catch (e) {}
      location.href = "/";
    });
  })();
</script>
</body>
</html>
